<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-labelledby="sp-title sp-desc" font-family="'Liberation Sans', 'DejaVu Sans', Helvetica, Arial, sans-serif">
  <title id="sp-title">The Spine</title>
  <desc id="sp-desc">A source tree is parsed by tree-sitter into symbols, calls, imports and docs, stored in one embedded SQLite file with an FTS5 table, and queried without an agent reading files.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#f0f3f7"/>
    </linearGradient>
  </defs>
  <rect width="1240" height="700" fill="url(#paper)"/>

  <text x="48" y="56" fill="#16181d" font-size="24" font-weight="700">The Spine: your code, mapped once</text>
  <text x="48" y="82" fill="#7b8797" font-size="14">One pass, one embedded SQLite file, no model, no cloud. Every later question is an index lookup.</text>

  <g>
    <rect x="48" y="120" width="212" height="150" rx="14" fill="#ffffff" stroke="#c9d2de"/>
    <text x="72" y="150" fill="#1f6feb" font-size="11" font-weight="700">SOURCE TREE</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3c4655">
      <text x="72" y="180">src/auth.rs</text>
      <text x="72" y="202">src/routes.js</text>
      <text x="72" y="224">app/views.py</text>
      <text x="72" y="246">internal/handler.go</text>
    </g>
    <text x="72" y="262" fill="#8b98a9" font-size="11">git worktree, module level code included</text>
  </g>

  <path d="M266 195 L306 195" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6feb"/></marker></defs>

  <g>
    <rect x="310" y="120" width="212" height="150" rx="14" fill="#ffffff" stroke="#c9d2de"/>
    <text x="334" y="150" fill="#1f6feb" font-size="11" font-weight="700">TREE SITTER</text>
    <g font-size="12" fill="#3c4655">
      <text x="334" y="180">eight languages</text>
      <text x="334" y="202">symbols, signatures, docs</text>
      <text x="334" y="224">call edges, import edges</text>
      <text x="334" y="246">constants, fields, enum variants</text>
    </g>
    <text x="334" y="262" fill="#8b98a9" font-size="11">a new language is one grammar crate</text>
  </g>

  <path d="M528 195 L568 195" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <g>
    <rect x="572" y="104" width="300" height="182" rx="14" fill="#16202f" stroke="#33415a"/>
    <text x="596" y="134" fill="#7fb2ff" font-size="11" font-weight="700">.heides/index.db</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">
      <text x="596" y="162">files      path, lang, mtime, size</text>
      <text x="596" y="184">symbols    name, kind, file, line, doc</text>
      <text x="596" y="206">calls      caller, callee, file, line</text>
      <text x="596" y="228">imports    file, imported, line</text>
      <text x="596" y="250">search     FTS5 over names and docs</text>
      <text x="596" y="272">search_text FTS5 over literals</text>
    </g>
  </g>

  <g>
    <rect x="900" y="104" width="292" height="182" rx="14" fill="#ffffff" stroke="#c9d2de"/>
    <text x="924" y="134" fill="#1f6feb" font-size="11" font-weight="700">WHAT AN AGENT GETS INSTEAD</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3c4655">
      <text x="924" y="162">query callers &lt;name&gt;</text>
      <text x="924" y="184">query imports &lt;name&gt;</text>
      <text x="924" y="206">query search &lt;text&gt;</text>
      <text x="924" y="228">query definition &lt;name&gt;</text>
      <text x="924" y="250">describe</text>
      <text x="924" y="272">plan &lt;objective&gt;</text>
    </g>
  </g>

  <path d="M722 292 L722 320 L1046 320 L1046 292" stroke="#8b98a9" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b98a9"/></marker></defs>

  <g>
    <rect x="48" y="330" width="560" height="150" rx="14" fill="#ffffff" stroke="#c9d2de"/>
    <text x="72" y="360" fill="#1f6feb" font-size="11" font-weight="700">ENTRYPOINTS ARE RECOGNISED, NOT GUESSED</text>
    <text x="72" y="386" fill="#3c4655" font-size="13">A function nobody calls in the workspace is not automatically dead code.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3c4655">
      <text x="72" y="412">app.get("/user/:id", findUser)</text>
      <text x="72" y="434">@app.route("/items")  -&gt;  list_items</text>
      <text x="72" y="456">path("items/&lt;int:id&gt;", item_detail)</text>
    </g>
    <text x="72" y="470" fill="#8b98a9" font-size="11">Express, Flask, Django, Go. A handler stops being reported as an uncalled root.</text>
  </g>

  <g>
    <rect x="632" y="330" width="560" height="150" rx="14" fill="#ffffff" stroke="#c9d2de"/>
    <text x="656" y="360" fill="#1f6feb" font-size="11" font-weight="700">THE COST CONTRACT, ENFORCED EVERY PUSH</text>
    <g font-size="12.5" fill="#3c4655">
      <text x="656" y="390">index time: linear in files, one pass, no quadratic re-analysis</text>
      <text x="656" y="414">queries: indexed lookups, never a workspace scan</text>
      <text x="656" y="438">memory: bounded, no AST kept between passes</text>
      <text x="656" y="462">offline: analysis never needs the network</text>
    </g>
  </g>

  <g>
    <rect x="48" y="508" width="1144" height="146" rx="14" fill="#16202f" stroke="#33415a"/>
    <text x="72" y="538" fill="#7fb2ff" font-size="11" font-weight="700">VERIFIED ON THE RELEASE BINARY, TODAY, ON A FIXTURE</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">
      <text x="72" y="566">$ heides query search users</text>
      <text x="392" y="566" fill="#8b98a9">2 hit(s), both literals, file and line</text>
      <text x="72" y="592">$ heides plan "add a health endpoint"</text>
      <text x="392" y="592" fill="#8b98a9">nothing exists, says so, names what to build on</text>
      <text x="72" y="618">$ heides describe</text>
      <text x="392" y="618" fill="#8b98a9">route handler gone from uncalled roots</text>
    </g>
  </g>

  <text x="48" y="684" fill="#8b98a9" font-size="12">Index version 8. Sizes and timings are not printed here on purpose: the CI scale phase asserts the budget on every push.</text>
</svg>
