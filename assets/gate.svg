<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-labelledby="gt-title gt-desc" font-family="'Liberation Sans', 'DejaVu Sans', Helvetica, Arial, sans-serif">
  <title id="gt-title">The pre-apply gate</title>
  <desc id="gt-desc">An agent proposes a patch, heides checks the diff before it lands, the verdict is machine readable, and the agent either commits or is told what to fix.</desc>
  <defs>
    <linearGradient id="paper3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#f0f3f7"/>
    </linearGradient>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6feb"/></marker>
    <marker id="g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker>
    <marker id="r3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1240" height="560" fill="url(#paper3)"/>

  <text x="48" y="56" fill="#16181d" font-size="24" font-weight="700">The gate: before the patch lands</text>
  <text x="48" y="82" fill="#7b8797" font-size="14">The agent suggests. The harness decides what is safe. A verdict is structured, so an agent can gate on it without reading prose.</text>

  <g>
    <rect x="48" y="128" width="196" height="104" rx="14" fill="#ffffff" stroke="#c9d2de"/>
    <text x="72" y="158" fill="#1f6feb" font-size="11" font-weight="700">AGENT</text>
    <text x="72" y="184" fill="#3c4655" font-size="13">writes a patch</text>
    <text x="72" y="206" fill="#8b98a9" font-size="11.5">any model, any editor</text>
  </g>

  <path d="M250 180 L286 180" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#a3)"/>

  <g>
    <rect x="290" y="128" width="228" height="104" rx="14" fill="#ffffff" stroke="#c9d2de"/>
    <text x="314" y="158" fill="#1f6feb" font-size="11" font-weight="700">heides staged &lt;patch&gt;</text>
    <text x="314" y="184" fill="#3c4655" font-size="13">judges the diff, not the file</text>
    <text x="314" y="206" fill="#8b98a9" font-size="11.5">runs before the write, in memory</text>
  </g>

  <path d="M524 180 L560 180" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#a3)"/>

  <g>
    <rect x="564" y="112" width="300" height="136" rx="14" fill="#16202f" stroke="#33415a"/>
    <text x="588" y="142" fill="#7fb2ff" font-size="11" font-weight="700">WHAT IT CHECKS</text>
    <g font-size="12.5" fill="#e6edf3">
      <text x="588" y="170">signature widening, not just removal</text>
      <text x="588" y="192">callers and imports the patch breaks</text>
      <text x="588" y="214">taint introduced by the patch</text>
      <text x="588" y="236">tests, when the project has them</text>
    </g>
  </g>

  <path d="M870 180 L906 180" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#a3)"/>

  <g>
    <rect x="910" y="112" width="282" height="60" rx="12" fill="#eaf7ee" stroke="#1a7f37"/>
    <text x="934" y="140" fill="#1a7f37" font-size="13" font-weight="700">safe: commit it</text>
    <text x="934" y="158" fill="#3c4655" font-size="11.5">exit 0</text>
  </g>
  <g>
    <rect x="910" y="184" width="282" height="64" rx="12" fill="#fdeeec" stroke="#c0392b"/>
    <text x="934" y="212" fill="#c0392b" font-size="13" font-weight="700">blocked: with evidence</text>
    <text x="934" y="230" fill="#3c4655" font-size="11.5">exit 1, file and line for each finding</text>
  </g>

  <path d="M1051 248 L1051 300 L200 300 L200 336" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#r3)"/>
  <text x="600" y="322" fill="#c0392b" font-size="12" font-weight="700">the agent reads the finding, fixes the cause, runs the gate again</text>

  <g>
    <rect x="48" y="342" width="1144" height="106" rx="14" fill="#ffffff" stroke="#c9d2de"/>
    <text x="72" y="372" fill="#1f6feb" font-size="11" font-weight="700">THE SAME VERDICT OVER MCP, FOR ANY MCP CLIENT</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3c4655">
      <text x="72" y="400">harmony.check   the guards, human readable</text>
      <text x="72" y="424">harmony.report  the same verdict as JSON, one object per finding, with counts and a clean flag</text>
    </g>
  </g>

  <g>
    <rect x="48" y="470" width="1144" height="62" rx="14" fill="#16202f" stroke="#33415a"/>
    <text x="72" y="500" fill="#7fb2ff" font-size="11" font-weight="700">WHY THIS EXISTS</text>
    <text x="72" y="522" fill="#e6edf3" font-size="12.5">An agent can change a signature and break three callers it never read, while the test suite stays green because it never ran them.</text>
  </g>
</svg>
