<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="230" fill="#ffffff"/>
  <text x="16" y="28" font-size="15" font-weight="bold" fill="#263238">The agent reads the map instead of burning tokens on code</text>

  <rect x="30" y="55" width="150" height="120" rx="12" fill="#f3e5f5"/>
  <text x="105" y="85" font-size="13" font-weight="bold" fill="#6a1b9a" text-anchor="middle">the agent</text>
  <text x="105" y="108" font-size="11" fill="#455a64" text-anchor="middle">any model, any</text>
  <text x="105" y="122" font-size="11" fill="#455a64" text-anchor="middle">editor, asks</text>
  <rect x="48" y="134" width="114" height="22" rx="11" fill="#e1bee7"/>
  <text x="105" y="149" font-size="11" fill="#4a148c" text-anchor="middle">who calls this</text>

  <path d="M180 115 L238 115" stroke="#90a4ae" stroke-width="2"/>
  <polygon points="234,110 246,115 234,120" fill="#90a4ae"/>

  <rect x="248" y="42" width="280" height="146" rx="14" fill="#e8f5e9"/>
  <text x="388" y="66" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">index answers</text>
  <text x="388" y="82" font-size="12" fill="#388e3c" text-anchor="middle">describe, query callers,</text>
  <text x="388" y="98" font-size="12" fill="#388e3c" text-anchor="middle">neighbors, imports</text>
  <rect x="266" y="112" width="244" height="30" rx="15" fill="#c8e6c9"/>
  <text x="388" y="131" font-size="11" fill="#1b5e20" text-anchor="middle">answers are kilobytes,</text>
  <text x="388" y="145" font-size="11" fill="#1b5e20" text-anchor="middle">reads would be megabytes</text>
  <text x="388" y="175" font-size="10" fill="#78909c" text-anchor="middle">fresh because rescans are milliseconds</text>

  <path d="M528 115 L590 115" stroke="#90a4ae" stroke-width="2"/>
  <polygon points="586,110 598,115 586,120" fill="#90a4ae"/>

  <rect x="600" y="55" width="140" height="120" rx="12" fill="#fff3e0"/>
  <text x="670" y="85" font-size="13" font-weight="bold" fill="#e65100" text-anchor="middle">changes</text>
  <text x="670" y="108" font-size="11" fill="#455a64" text-anchor="middle">every proposed</text>
  <text x="670" y="122" font-size="11" fill="#455a64" text-anchor="middle">patch passes the</text>
  <text x="670" y="136" font-size="11" fill="#455a64" text-anchor="middle">same guards</text>
  <rect x="616" y="146" width="108" height="20" rx="10" fill="#ffe0b2"/>
  <text x="670" y="160" font-size="10" fill="#bf360c" text-anchor="middle">before any write</text>

  <path d="M670 175 L670 195" stroke="#90a4ae" stroke-width="2"/>
  <polygon points="665,191 670,203 675,191" fill="#90a4ae"/>
  <text x="388" y="218" font-size="12" fill="#546e7a" text-anchor="middle">map for the eyes, judgment recomputed on every check, nothing stored can go stale</text>
</svg>
