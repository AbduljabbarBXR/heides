name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: heides-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: heides-aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-linux-android
            asset: heides-aarch64-linux-android
            ndk: true
          - os: macos-14
            target: aarch64-apple-darwin
            asset: heides-aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
            asset: heides-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: heides-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: setup Android NDK
        if: matrix.ndk == true
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
      - name: install cargo-ndk
        if: matrix.ndk == true
        run: cargo install cargo-ndk
      - name: build release (ndk)
        if: matrix.ndk == true
        run: cargo ndk -t arm64-v8a build --release
      - name: build release
        if: matrix.ndk != true
        run: cargo build --release --target ${{ matrix.target }}
      - name: stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/heides${{ matrix.os == 'windows-latest' && '.exe' || '' }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: dist/${{ matrix.asset }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "HEIDES $VERSION" \
            --notes "The code nervous system. Deterministic pre apply gating for AI coding agents, see the CHANGELOG and RULES files in the repo for the full story."

  publish-crates:
    name: publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
