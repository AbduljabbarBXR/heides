name: forecast-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "research/timesfm_forecast.py"

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install timesfm on CPU
        run: |
          pip install --quiet --no-cache-dir timesfm
          pip install --quiet --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run the zero shot forecast
        run: python research/timesfm_forecast.py
