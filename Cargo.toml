[package]
name = "heides"
version = "0.1.0"
edition = "2024"
description = "HEIDES: the code nervous system. A deterministic harness that gives AI agents senses, memory and judgment for code."
license = "MIT"
repository = "https://github.com/AbduljabbarBXR/heides"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
