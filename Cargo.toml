[package]
name = "heides"
version = "0.24.0"
edition = "2024"
description = "HEIDES: the code nervous system. A deterministic harness that gives AI agents senses, memory and judgment for code."
license = "MIT"
repository = "https://github.com/AbduljabbarBXR/heides"
homepage = "https://github.com/AbduljabbarBXR/heides"
readme = "README.md"
keywords = ["code-analysis", "static-analysis", "mcp", "ai-agents", "deterministic"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27.0"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"

tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-c = "0.24.1"
tree-sitter-ruby = "0.23"
tree-sitter-cpp = "0.23.4"
tree-sitter-typescript = "0.23.2"
ureq = "3.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

# A build that keeps symbols so a stack can be read.
#
# The release profile strips, which makes a slow check impossible to profile: the
# frames come back as `??` and every guess about the hot loop has to be settled by
# editing code and rebuilding. This profile is the same optimisation level with
# `strip = false`, so `gdb -p <pid> -ex bt` names the function.
#
# Not used for releases. The stripped binary is what ships.
[profile.profiling]
inherits = "release"
strip = false
debug = 1
