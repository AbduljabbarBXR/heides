[package]
name = "heides"
version = "0.5.0"
edition = "2024"
description = "HEIDES: the code nervous system. A deterministic harness that gives AI agents senses, memory and judgment for code."
license = "MIT"
repository = "https://github.com/AbduljabbarBXR/heides"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tree-sitter = "0.27.0"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ureq = "3.4.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
